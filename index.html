<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="css/valentine.css" />
    <style>
    .responsive-gif {
        width: 80%;          /* Takes up 80% of the screen width */
        max-width: 300px;    /* But won't get huge on a PC */
        height: auto;        /* Keeps the shape perfect */
        display: block;
        margin: 20px auto;   /* Centers it with some space */
        border-radius: 15px; /* Optional: rounds the corners slightly */
    }

    #valentineQuestion {
        font-size: 1.5rem;   /* Makes the text easier to read on mobile */
        padding: 10px;
    }
    </style>
  </head>
  <body>
    <img src="please.png" alt="cat asking question" class="responsive-gif" />
    <div id="valentineQuestion"><b>Will you be my valentine?</b></div>
    <button class="answerButton" onclick="location.href='thankyou.html'">
      Yes
    </button>
    <button class="answerButton" id="noButton">I no no wanna o(╥﹏╥)o</button>
    <br />

<script>
    const noBtn = document.getElementById("noButton");
    const yesBtn = document.querySelector("button[onclick*='thankyou.html']");
    const mainImg = document.querySelector(".responsive-gif"); // Targets your cat image

    const messages = ["Sure?", "Really sure??", "Plsss :("];
    const gifs = [
        "http://googleusercontent.com/image_collection/image_retrieval/15309336242838973586_0",
        "http://googleusercontent.com/image_collection/image_retrieval/8703971364135243873_1",
        "http://googleusercontent.com/image_collection/image_retrieval/15576588532097927306_3"
    ];
    let msgIndex = 0;

    // This function handles the "Running Away"
    function moveButton() {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        
        noBtn.style.position = "fixed"; // Use fixed to ensure it jumps over everything
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        // This changes the text and the GIF
        if (msgIndex < messages.length) {
            noBtn.innerHTML = messages[msgIndex];
            mainImg.src = gifs[msgIndex];
            msgIndex++;
        }
        
        // Optional: Keep the original "Yes" button growing feature
        let currentSize = parseInt(window.getComputedStyle(yesBtn).fontSize);
        yesBtn.style.fontSize = (currentSize + 10) + "px";
    }

    // Trigger the move on both hover and click
    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("click", moveButton);
</script>

  </body>
</html>
