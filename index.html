<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="css/valentine.css" />
    <style>
    .responsive-gif {
        width: 80%;
        max-width: 300px;
        height: 300px; /* Setting a fixed height stops the text from moving */
        object-fit: contain; /* This keeps the GIF from looking stretched */
        display: block;
        margin: 20px auto;
        border-radius: 15px;
    }

    #valentineQuestion {
        font-size: 1.5rem;   /* Makes the text easier to read on mobile */
        padding: 10px;
              .answerButton {
        display: block;      /* Makes it easier to center */
        margin: 15px auto;   /* Automatically centers it horizontally */
        padding: 15px 30px;
        border-radius: 10px;
        font-weight: bold;
        background-color: #ff4d6d;
        color: white;
        border: none;
        cursor: pointer;
        width: fit-content;  /* Prevents it from stretching to full width */
        max-width: 90%;      /* Ensures it stays within phone screen edges */
        white-space: nowrap; /* Keeps the word "Yes" on one line */
    }
    }
    </style>
  </head>
  <body>
    <img src="please.png" alt="" class="responsive-gif" />
    <div id="valentineQuestion"><b>Will you be my valentine?</b></div>
    <button class="answerButton" onclick="location.href='thankyou.html'">
      Yes
    </button>
    <button class="answerButton" id="noButton">I no no wanna o(╥﹏╥)o</button>
    <br />

<script>
    const noBtn =document.getElementById('noButton');
    const yesBtn = document.querySelector("button[onclick*='thankyou.html']");
    const mainImg = document.querySelector(".responsive-gif");// Targets your cat image

    const messages = ["Sure?", "Really sure??", "Think again🥹", "Last chance", " You might regret this", "Plsss 😭"];
    const gifs = [
        "2nd.png",
        "third.png",
        "4th.png"
    ];
    let msgIndex = 0;

    // This function handles the "Running Away"
    function moveButton() {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        
        noBtn.style.position = "fixed"; // Use fixed to ensure it jumps over everything
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        // This changes the text and the GIF
if (msgIndex < messages.length) {
    noBtn.innerHTML = messages[msgIndex];
    // This part makes sure it stays on 4th.png once it reaches it
    const gifIndex = Math.min(msgIndex, gifs.length - 1);
    mainImg.src = gifs[gifIndex];
    msgIndex++;
}
        
        // Optional: Keep the original "Yes" button growing feature
        let currentSize = parseInt(window.getComputedStyle(yesBtn).fontSize);
        yesBtn.style.fontSize = (currentSize + 20) + "px";
    }

    // Trigger the move on both hover and click
    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("click", moveButton);
</script>

  </body>
</html>
